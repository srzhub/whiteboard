<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SDE Collaborative Whiteboard v2</title>
    <style>
        body { margin: 0; padding: 20px; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #f4f4f4; }
        .controls { margin-bottom: 10px; }
        canvas { border: 2px solid #333; background: #fff; cursor: crosshair; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #ff4757; color: white; border: none; border-radius: 5px; }
        button:hover { background: #ff6b81; }
    </style>
</head>
<body>

    // Controls for pen color and size
    <div class="controls">
        <button onclick="clearBoard()">Clear Whiteboard</button>
        <input type="color" id="colorPicker" value="#000000">
        <input type="range" id="sizeSlider" min="1" max="20" value="2">
        <label>Size</label>
        <button id="eraserBtn" onclick="toggleEraser()" style="background: #2f3542;">Eraser: OFF</button>
    </div>

    <div class="status-bar" style="margin-bottom: 10px; font-weight: bold; color: #57606f;">
        Online Users: <span id="userCount">1</span>
    </div>

    <h3>Current Room: <span id="roomDisplay"></span></h3>


    <canvas id="canvas" width="800" height="600"></canvas>

    <script src="/socket.io/socket.io.js"></script>
    <script src = "whiteboard.js">  </script>
                
</body>
</html>
